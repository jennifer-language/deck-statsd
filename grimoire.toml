# Grimoire book configuration for the @jennifer/statsd documentation.

[book]
title = "@jennifer/statsd"
description = "A StatsD client: counters, gauges, timings and sets over UDP, with sample rates, DogStatsD tags and batching"
language = "en"
src = "docs"

[build]
out = "site"
clean = true
jobs = 0

[html]
theme = "nordic"
mode = "auto"
navPosition = "left"
tocPosition = "right"
tocDepth = 3
sectionNumbers = true
titleUrl = "https://jennifer-language.github.io/deck-statsd/"
repoUrl = "https://github.com/jennifer-language/deck-statsd"
repoLabel = "Source"
editUrl = "https://github.com/jennifer-language/deck-statsd/edit/main/docs/{path}"

[highlight]
enabled = true

[search]
enabled = true

[pdf]
enabled = false
